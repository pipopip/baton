name: Lightweight checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Windows has no time zone database of its own: zoneinfo reads the tzdata package there, and the queue's
      # tests check a host policy's time zone
      - run: python -m pip install tzdata
      - run: python -m unittest discover -s tests -p test_procs.py
      - run: python -m unittest discover -s tests -p test_compute_status.py
      - run: python -m unittest discover -s tests -p test_compute_pickup.py
      - run: python -m unittest discover -s mods/compute-queue/bin -p "test_*.py"
